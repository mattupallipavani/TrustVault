services:
  - type: web
    name: trustvault
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_LOCATION
        value: /app/trustvault-storage
      - key: DEMO_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"
