spring.application.name=trustvault
server.port=${PORT:10000}
server.address=0.0.0.0

# ---------------------------------------------------------------------------
# Datasource: Automatically detects driver from JDBC URL (PostgreSQL/MySQL/H2)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trustvault_db}
spring.datasource.username=${DB_USERNAME:trustvault_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

# ---------------------------------------------------------------------------
# Redis & Rate Limiting
# ---------------------------------------------------------------------------
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ---------------------------------------------------------------------------
# Flyway Schema Migrations
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# HTTP Session Security
# ---------------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# ---------------------------------------------------------------------------
# Multipart & Upload Limits (20 MB maximum document size)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.servlet.multipart.resolve-lazily=true

# ---------------------------------------------------------------------------
# Error Responses: Never leak internal stack traces or database errors
# ---------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ---------------------------------------------------------------------------
# Actuator Monitoring & Health Endpoints
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

# ---------------------------------------------------------------------------
# Application Storage Configuration (supabase, minio, or local)
# ---------------------------------------------------------------------------
trustvault.storage.type=${STORAGE_TYPE:local}
trustvault.storage.location=${STORAGE_LOCATION:./trustvault-storage}
trustvault.storage.supabase.url=${SUPABASE_URL:}
trustvault.storage.supabase.service-key=${SUPABASE_SERVICE_KEY:}
trustvault.storage.supabase.bucket=${SUPABASE_BUCKET:trustvault-documents}
trustvault.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
trustvault.storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
trustvault.storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
trustvault.storage.minio.bucket=${MINIO_BUCKET:trustvault-documents}
# Address clients use to reach MinIO, needed to sign usable presigned URLs.
# Empty means "sign for the internal endpoint" (usable only inside the network).
trustvault.storage.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:}
# Lifetimes above 300s are clamped by the storage provider.
trustvault.storage.minio.presign-ttl-seconds=${MINIO_PRESIGN_TTL_SECONDS:60}
# Pinned so signing does not require a round-trip to the endpoint being signed for.
trustvault.storage.minio.region=${MINIO_REGION:us-east-1}

# ---------------------------------------------------------------------------
# Storage maintenance: scheduled integrity verification and version retention.
# Times are off-peak by default; all jobs can be disabled independently.
# ---------------------------------------------------------------------------
trustvault.maintenance.enabled=${MAINTENANCE_ENABLED:true}
trustvault.maintenance.integrity.enabled=${MAINTENANCE_INTEGRITY_ENABLED:true}
trustvault.maintenance.integrity.cron=${MAINTENANCE_INTEGRITY_CRON:0 0 3 * * *}
trustvault.maintenance.integrity.deep=${MAINTENANCE_DEEP_ENABLED:false}
trustvault.maintenance.integrity.deep-cron=${MAINTENANCE_DEEP_CRON:0 0 4 * * SUN}
trustvault.maintenance.integrity.stale-after-hours=${MAINTENANCE_STALE_AFTER_HOURS:48}
trustvault.maintenance.retention.enabled=${MAINTENANCE_RETENTION_ENABLED:true}
trustvault.maintenance.retention.cron=${MAINTENANCE_RETENTION_CRON:0 30 3 * * *}
trustvault.maintenance.retention.days=${MAINTENANCE_RETENTION_DAYS:30}
# Slack-compatible webhook for failures; empty means log + health endpoint only.
trustvault.maintenance.alerts.webhook-url=${MAINTENANCE_ALERT_WEBHOOK:}

# ---------------------------------------------------------------------------
# Demo Seed Configuration
# ---------------------------------------------------------------------------
trustvault.seed.enabled=${SEED_ENABLED:true}
trustvault.demo-password=${DEMO_PASSWORD:TrustVault#2026}
