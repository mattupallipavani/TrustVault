spring.application.name=trustvault

# ---------------------------------------------------------------------------
# Datasource: Automatically detects driver from JDBC URL (PostgreSQL/MySQL/H2)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trustvault_db}
spring.datasource.username=${DB_USERNAME:trustvault_app}
spring.datasource.password=${DB_PASSWORD:}

# ---------------------------------------------------------------------------
# Redis & Rate Limiting
# ---------------------------------------------------------------------------
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ---------------------------------------------------------------------------
# Flyway Schema Migrations
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# HTTP Session Security
# ---------------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# ---------------------------------------------------------------------------
# Multipart & Upload Limits (20 MB maximum document size)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.servlet.multipart.resolve-lazily=true

# ---------------------------------------------------------------------------
# Error Responses: Never leak internal stack traces or database errors
# ---------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ---------------------------------------------------------------------------
# Actuator Monitoring & Health Endpoints
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

# ---------------------------------------------------------------------------
# Application Storage Configuration (minio or local)
# ---------------------------------------------------------------------------
trustvault.storage.type=${STORAGE_TYPE:local}
trustvault.storage.location=${STORAGE_LOCATION:./trustvault-storage}
trustvault.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
trustvault.storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
trustvault.storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
trustvault.storage.minio.bucket=${MINIO_BUCKET:trustvault-documents}

# ---------------------------------------------------------------------------
# Demo Seed Configuration
# ---------------------------------------------------------------------------
trustvault.seed.enabled=${SEED_ENABLED:true}
trustvault.demo-password=${DEMO_PASSWORD:TrustVault#2026}
