# Profile for Testcontainers-based integration tests.
# DataSource properties are injected at runtime via @DynamicPropertySource.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.data.redis.repositories.enabled=false

server.servlet.session.cookie.secure=false

trustvault.storage.location=target/tc-test-storage
trustvault.seed.enabled=false
trustvault.maintenance.enabled=false

