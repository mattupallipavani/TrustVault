spring.datasource.url=jdbc:h2:mem:trustvault-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.data.redis.repositories.enabled=false

server.servlet.session.cookie.secure=false

trustvault.storage.location=target/test-storage

# The integration tests need one seeded account per role.
trustvault.seed.enabled=true
