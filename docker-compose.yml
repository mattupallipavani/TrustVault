version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trustvault_db}
      POSTGRES_USER: ${DB_USERNAME:-trustvault_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=128MB"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-trustvault_app} -d ${POSTGRES_DB:-trustvault_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trustvault-net

  redis:
    image: redis:7.4-alpine
    container_name: trustvault-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - trustvault-net

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: trustvault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - trustvault-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustvault-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trustvault_db}
      DB_USERNAME: ${DB_USERNAME:-trustvault_app}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-trustvault-documents}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-TrustVault#2026}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      STORAGE_TYPE: ${STORAGE_TYPE:-minio}
      STORAGE_LOCATION: /data
      DDL_AUTO: validate
    ports:
      - "8080:8080"
    volumes:
      - vault-data:/data
    networks:
      - trustvault-net

networks:
  trustvault-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  vault-data:
